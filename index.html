<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Show Project | Yonatan Teklemariam</title>
  <link href="style.css" rel="stylesheet" />
</head>

<body>

  <div id="error-overlay">
    <p id="error-message"></p>
  </div>

  <!-- CLEAN HORIZONTAL CONTROL BAR -->
  <div class="control-bar">

    <span class="bar-title">Ref: <a href="https://www.tvmaze.com/">tvmaze.com</a></span>

    <input type="search" id="q" placeholder="Search shows" />

    <div class="field-box">
      <label for="shows-selector">A to Z</label>
      <select id="shows-selector">
        <option value="">--Select a show--</option>
      </select>
    </div>

    <span id="episode-count">Displaying 0 episodes</span>

  </div>

  <!-- SHOW PAGE CONTROLS (hidden until a show is selected) -->
  <div id="show-controls" class="control-bar hidden">

    <span id="shows-title" class="bar-title"></span>

    <button id="back-to-shows">&larr; All Shows</button>

    <div class="field-box">
      <label for="episode-selector">Jump to Episode</label>
      <select id="episode-selector">
        <option value="">--- All Episodes ---</option>
      </select>
    </div>

    <div class="field-box">
      <label for="episode-search">Search Episodes</label>
      <input type="text" id="episode-search" placeholder="Enter episode name..." />
    </div>

    <span id="episode-count-2"></span>

  </div>

  <div id="root"></div>

  <script src="script.js"></script>
</body>

</html>
